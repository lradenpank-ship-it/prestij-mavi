# /etc/nginx/sites-available/prestij  — HTTPS için: sudo certbot --nginx -d www.ornek-alan-adi.com
server {
    listen 80;
    server_name www.ornek-alan-adi.com ornek-alan-adi.com;

    client_max_body_size 6m;
    gzip off;                        # uygulama kendi sıkıştırır

    location /static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1d;
        expires 7d;
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 365d;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # istemci başlığını ezer (sahte IP engellenir)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
